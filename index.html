<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador Rápido y Moderno</title>
    <style>
        /* Estilos generales y fondo degradado animado */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            color: #333;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Tarjeta contenedora con efecto de cristal (Glassmorphism) */
        .card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            text-align: center;
            width: 320px;
        }

        h1 {
            margin: 0 0 1.5rem 0;
            color: white;
            font-size: 1.8rem;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.2);
        }

        /* El número del contador */
        #counter-value {
            font-size: 5rem;
            font-weight: bold;
            color: white;
            margin: 1rem 0;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
            transition: transform 0.1s ease;
        }

        /* Contenedor de botones */
        .button-group {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 1.5rem;
        }

        /* Estilo base de los botones */
        button {
            padding: 0.8rem 1.2rem;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button:active {
            transform: scale(0.95);
        }

        /* Colores específicos de los botones */
        .btn-decrease {
            background-color: #ff4d4d;
            color: white;
            flex: 1;
        }

        .btn-decrease:hover { background-color: #ff3333; }

        .btn-reset {
            background-color: #e0e0e0;
            color: #333;
        }

        .btn-reset:hover { background-color: #d4d4d4; }

        .btn-increase {
            background-color: #2ecc71;
            color: white;
            flex: 1;
        }

        .btn-increase:hover { background-color: #27ae60; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Mi Contador</h1>
        <div id="counter-value">0</div>
        
        <div class="button-group">
            <button class="btn-decrease" onclick="decrease()">-</button>
            <button class="btn-reset" onclick="reset()">Reset</button>
            <button class="btn-increase" onclick="increase()">+</button>
        </div>
    </div>

    <script>
        // Lógica simple y rápida en JavaScript
        let count = 0;
        const counterDisplay = document.getElementById('counter-value');

        function updateDisplay() {
            counterDisplay.textContent = count;
            
            // Animación rápida al cambiar de número
            counterDisplay.style.transform = 'scale(1.1)';
            setTimeout(() => {
                counterDisplay.style.transform = 'scale(1)';
            }, 100);
        }

        function increase() {
            count++;
            updateDisplay();
        }

        function decrease() {
            count--;
            updateDisplay();
        }

        function reset() {
            count = 0;
            updateDisplay();
        }
    </script>
</body>
</html>
